[package]
name = "clear-system-interface"
version = "0.1.0"
edition = "2021"

[dependencies]
clear-ui = { path = "../ui-framework" }
winit = "0.30"
wgpu = "24"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
taffy = "0.10.1"
glyphon = "0.8"
tokio = { version = "1", features = ["full"] }
zbus = "5"
futures = "0.3"
serde = { version = "1", features = ["derive"] }

[lib]
name = "clear_system_interface"
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "clear-system-interface"
