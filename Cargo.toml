[package]
name = "cce-system-interface"
version = "0.1.0"
edition = "2021"

[dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "dc5eee9ae67076a9945e1edd8ffc82714987f1ef" }
# The window manager's action names and stock bindings, for the Keyboard page.
cce-window-manager = { git = "https://github.com/lsgalante/cce-window-manager.git", rev = "0f2c9a14cb359ab57a7b5fcb31dc2c7be7f5260a" }
smithay-client-toolkit = "0.19.2"
calloop = "0.13.0"
calloop-wayland-source = "0.3.0"
wayland-client = { version = "0.31", features = ["system"] }
xkeysym = "0.2"
tokio = { version = "1", features = ["full"] }
zbus = "5"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kdl = "4.6"
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.12", features = ["json"] }
ring = "0.17.14"
base64 = "0.22"


[lib]
name = "cce_settings"
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "cce-system-interface"

[lints.clippy]
# The toolkit's house style (cce-ui's [lints.clippy]): geometry, colour and paint state
# taken piecewise, and the legacy tuple views.
too_many_arguments = "allow"
type_complexity = "allow"
